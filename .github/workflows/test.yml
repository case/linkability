name: Test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "bin/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - "mise.toml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "bin/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - "mise.toml"

permissions: {}

# A new push to a PR cancels its older run; in-progress runs on main are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # shellcheck and jactionlint, pinned in mise.toml. bin/lint fails without
      # them rather than skipping, so this step is not optional.
      - name: Install the pinned linters
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Install dependencies
        run: bin/setup

      - name: Run linters and tests
        run: bin/test
