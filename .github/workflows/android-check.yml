name: Android Platform Check

on:
  schedule:
    - cron: "17 9 * * *" # Daily at 09:17 UTC; off the hour, when schedules queue
  workflow_dispatch: {}

concurrency:
  group: android-check
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      patch_artifact: ${{ steps.patch.outputs.artifact }}
    steps:
      - name: Check out repo
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        timeout-minutes: 3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync

      - name: Download latest zone data
        timeout-minutes: 5
        run: |
          uv run linkability download zones
          uv run linkability download brands

      - name: Run Android checks for all refs
        timeout-minutes: 10
        run: uv run linkability report android-all

      - name: Show summary
        timeout-minutes: 2
        run: uv run linkability report summary --platform android

      - name: Create report update patch
        id: patch
        timeout-minutes: 3
        run: bin/ci-make-report-patch Reports/

      - name: Upload report update patch
        if: steps.patch.outputs.changed == 'true'
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.patch.outputs.artifact }}
          path: ${{ runner.temp }}/report-update.patch
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repo
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download report update patch
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check.outputs.patch_artifact }}
          path: ${{ runner.temp }}/report-update

      - name: Rebase onto current main
        timeout-minutes: 5
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PUSH_REMOTE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            bin/ci-land-report-patch rebase --guard Reports/

      # Untrusted artifact, checked before and after it reaches the filesystem.
      # The step holds no credentials. Why: Docs/ci-signing.md
      - name: Validate and apply report update
        timeout-minutes: 3
        run: bin/ci-apply-report-patch "$RUNNER_TEMP/report-update/report-update.patch"

      - name: Sign, push and open the reports PR
        id: pr
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SSH_SIGNING_KEY: ${{ secrets.CI_SSH_SIGNING_KEY }}
          CI_COMMITTER_NAME: ${{ vars.CI_COMMITTER_NAME }}
          CI_COMMITTER_EMAIL: ${{ vars.CI_COMMITTER_EMAIL }}
          # Literals, not producer outputs: nothing crosses into the signing job. Why: Docs/ci-signing.md
          BRANCH: reports/android
          TITLE: Update Android platform reports
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          ## Android Platform Check

          Automated scheduled check of TLD auto-linking across Android versions.

          **Refs:** All versions in `android_refs.py`
          **Source:** AOSP `Patterns.java` TLD regex

          See `Reports/summary.csv` for aggregate stats and `Reports/snapshots/android/` for per-zone details.
          EOF
          PUSH_REMOTE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            bin/ci-open-report-pr "$BRANCH" "$TITLE" "$RUNNER_TEMP/pr-body.md"

      - name: Remove signing key
        if: always()
        timeout-minutes: 1
        run: rm -f "$RUNNER_TEMP/linkability-ci-signing"

  # Results matching main again mean an open report PR is superseded. Why: Docs/ci-signing.md
  close-superseded:
    needs: check
    if: needs.check.result == 'success' && needs.check.outputs.changed == 'false'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repo
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Close a superseded report PR
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMITTER_EMAIL: ${{ vars.CI_COMMITTER_EMAIL }}
          BRANCH: reports/android
        run: |
          PUSH_REMOTE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            bin/ci-close-report-pr "$BRANCH"
